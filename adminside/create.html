<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PingXiang Charity — New Event</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body ng-app="adminApp" ng-controller="CreateController">
  <header class="admin-nav" ng-controller="AdminNavController">
    <div class="admin-nav__inner">
      <a class="admin-nav__logo" href="index.html">PingXiang Charity <span>Admin</span></a>
      <nav class="admin-nav__links">
        <a href="index.html">Dashboard</a>
        <a href="create.html" class="is-active">New event</a>
        <a href="#" ng-click="logout()">Log out</a>
      </nav>
    </div>
  </header>

  <main class="admin-main">
    <a class="back-link" href="index.html"><ico name="arrowLeft" size="16"></ico> Back to dashboard</a>

    <div class="admin-head">
      <div>
        <h1 class="admin-title">New event</h1>
        <p class="admin-sub">Add a charity event to the platform.</p>
      </div>
    </div>

    <form class="form-card" ng-submit="submit()" novalidate>
      <div class="form-grid">
        <div class="field field--full">
          <label for="event_name">Event name *</label>
          <input type="text" id="event_name" ng-model="form.event_name">
        </div>
        <div class="field field--full">
          <label for="description">Description</label>
          <textarea id="description" ng-model="form.description"></textarea>
        </div>
        <div class="field">
          <label for="event_date">Date &amp; time *</label>
          <input type="datetime-local" id="event_date" ng-model="form.event_date">
        </div>
        <div class="field">
          <label for="location">Location *</label>
          <input type="text" id="location" ng-model="form.location">
        </div>
        <div class="field">
          <label for="ticket_price">Ticket price ($)</label>
          <input type="number" id="ticket_price" step="0.01" min="0" ng-model="form.ticket_price">
        </div>
        <div class="field">
          <label for="image_url">Image URL</label>
          <input type="text" id="image_url" ng-model="form.image_url" placeholder="images/event.svg">
        </div>
        <div class="field">
          <label for="goal_amount">Goal amount ($)</label>
          <input type="number" id="goal_amount" step="0.01" min="0" ng-model="form.goal_amount">
        </div>
        <div class="field">
          <label for="raised_amount">Raised amount ($)</label>
          <input type="number" id="raised_amount" step="0.01" min="0" ng-model="form.raised_amount">
        </div>
        <div class="field">
          <label for="org_id">Organisation *</label>
          <select id="org_id" ng-model="form.org_id"
                  ng-options="o.org_id as o.org_name for o in organisations">
            <option value="">Select organisation</option>
          </select>
        </div>
        <div class="field">
          <label for="category_id">Category *</label>
          <select id="category_id" ng-model="form.category_id"
                  ng-options="c.category_id as c.category_name for c in categories">
            <option value="">Select category</option>
          </select>
        </div>
        <div class="field checkbox-field field--full">
          <input type="checkbox" id="is_suspended" ng-model="form.is_suspended">
          <label for="is_suspended">Suspend this event (hidden from the public site)</label>
        </div>
      </div>

      <p class="form-error" role="alert">{{ error }}</p>

      <div class="form-actions">
        <button type="submit" class="btn btn--solid" ng-disabled="submitting">
          {{ submitting ? 'Saving...' : 'Save event' }}
        </button>
        <a class="btn btn--outline" href="index.html">Cancel</a>
      </div>
    </form>
  </main>

  <script src="js/angular.min.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
  <script src="js/controllers.js"></script>
</body>
</html>
