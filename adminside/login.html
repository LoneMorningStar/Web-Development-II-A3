<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PingXiang Charity — Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body ng-app="adminApp" ng-controller="AdminLoginController">
  <header class="admin-nav">
    <div class="admin-nav__inner">
      <a class="admin-nav__logo" href="index.html">PingXiang Charity <span>Admin</span></a>
      <nav class="admin-nav__links">
        <a href="index.html">Dashboard</a>
      </nav>
    </div>
  </header>

  <main class="admin-main">
    <div class="login-card">
      <div class="login-card__head">
        <p class="eyebrow">Administrator</p>
        <h1 class="admin-title">Admin sign in</h1>
        <p class="admin-sub">Only administrators can add, edit and delete events.</p>
      </div>

      <form ng-submit="submit()" novalidate>
        <div class="form-grid">
          <div class="field field--full">
            <label for="email">Email *</label>
            <input type="email" id="email" ng-model="form.email" autocomplete="username">
          </div>
          <div class="field field--full">
            <label for="password">Password *</label>
            <input type="password" id="password" ng-model="form.password" autocomplete="current-password">
          </div>
        </div>

        <p class="form-error" role="alert">{{ error }}</p>

        <div class="form-actions">
          <button type="submit" class="btn btn--solid" ng-disabled="submitting">
            {{ submitting ? 'Signing in...' : 'Sign in' }}
          </button>
        </div>
      </form>
    </div>
  </main>

  <script src="js/angular.min.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
  <script src="js/controllers.js"></script>
</body>
</html>
