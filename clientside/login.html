<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PingXiang Charity — Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body ng-app="charityApp" ng-controller="LoginController" class="login-page">
  <main class="login-modal" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <button class="login-modal__backdrop" type="button" ng-click="close()" aria-label="Close log in"></button>

    <div class="login-modal__card">
      <button class="login-modal__close" type="button" ng-click="close()" aria-label="Close">
        <ico name="x" size="20"></ico>
      </button>

      <div class="login-modal__split">
        <!-- Left: the little face that watches your cursor -->
        <section class="login-modal__visual" aria-hidden="true">
          <login-face state="faceState"></login-face>
          <p class="login-modal__tagline">Nice to see you again.</p>
        </section>

        <!-- Right: the actual login form -->
        <section class="login-modal__form">
          <p class="eyebrow">Account</p>
          <h1 class="login-modal__title" id="login-title">Welcome back</h1>
          <p class="login-modal__sub">Log in to reserve your place at a charity event.</p>

          <form name="loginForm" ng-submit="submit()" novalidate>
            <div class="field">
              <label for="email">Email *</label>
              <input type="email" id="email" name="email" ng-model="form.email" required autocomplete="username">
            </div>
            <div class="field">
              <label for="password">Password *</label>
              <input type="password" id="password" name="password" ng-model="form.password" required
                     ng-focus="onPasswordFocus()" ng-blur="onPasswordBlur()" autocomplete="current-password">
            </div>

            <p class="form-error" role="alert">{{ error }}</p>

            <button type="submit" class="btn btn--solid login-modal__submit" ng-disabled="submitting || faceState === 'smile'">
              {{ submitting ? 'Logging in...' : (faceState === 'smile' ? 'Welcome!' : 'Log in') }}
            </button>
          </form>

          <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
        </section>
      </div>
    </div>
  </main>

  <script src="js/angular.min.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
  <script src="js/controllers.js"></script>
</body>
</html>
