<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PingXiang Charity — Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body ng-app="charityApp" ng-controller="LoginController">
  <header class="site-nav" id="site-nav">
    <div class="site-nav__inner">
      <a class="site-nav__logo" href="index.html">PingXiang Charity</a>
      <button class="site-nav__pill" id="nav-toggle" type="button">Navigate</button>
      <span class="site-nav__flower" id="nav-flower"></span>
      <button class="site-nav__burger" id="burger" type="button" aria-label="Toggle menu" aria-expanded="false" aria-controls="overlay">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <div class="overlay" id="overlay" ng-controller="NavController">
    <a href="index.html">Home</a>
    <a href="search.html">Search Events</a>
    <a href="login.html" ng-if="!isLoggedIn">Log in</a>
    <a href="signup.html" ng-if="!isLoggedIn">Sign up</a>
    <a href="#" ng-if="isLoggedIn" ng-click="logout()">Log out ({{ user.full_name }})</a>
  </div>

  <main class="detail-main">
    <article class="detail-article reg-wrap">
      <p class="eyebrow">Account</p>
      <h1 class="detail-head__title">Log in</h1>

      <form name="loginForm" ng-submit="submit()" novalidate class="reg-form" data-reveal>
        <div class="field">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" ng-model="form.email" required>
        </div>
        <div class="field">
          <label for="password">Password *</label>
          <input type="password" id="password" name="password" ng-model="form.password" required>
        </div>

        <p class="form-error" role="alert">{{ error }}</p>

        <button type="submit" class="btn btn--solid" ng-disabled="submitting">
          {{ submitting ? 'Logging in...' : 'Log in' }}
        </button>

        <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
      </form>
    </article>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <span class="site-footer__brand">PingXiang Charity</span>
      <span class="site-footer__copy">&copy; 2026 PingXiang Charity</span>
      <nav class="site-footer__links">
        <a href="index.html">Home</a>
        <a href="search.html">Search</a>
      </nav>
    </div>
  </footer>

  <script src="js/angular.min.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
  <script src="js/controllers.js"></script>
</body>
</html>
