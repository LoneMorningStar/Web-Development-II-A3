<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PingXiang Charity — Event Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body ng-app="charityApp" ng-controller="EventFormController">
  <header class="site-nav" id="site-nav">
    <div class="site-nav__inner">
      <a class="site-nav__logo" href="index.html">PingXiang Charity</a>
      <button class="site-nav__pill" id="nav-toggle" type="button">Navigate</button>
      <span class="site-nav__flower" id="nav-flower"></span>
      <button class="site-nav__burger" id="burger" type="button" aria-label="Toggle menu" aria-expanded="false" aria-controls="overlay">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <div class="overlay" id="overlay" ng-controller="NavController">
    <a href="index.html">Home</a>
    <a href="events.html">Events</a>
    <a href="profile.html" ng-if="isLoggedIn">My Profile</a>
    <a href="admin.html" ng-if="isAdmin">Admin</a>
    <a href="login.html" ng-if="!isLoggedIn">Log in</a>
    <a href="signup.html" ng-if="!isLoggedIn">Sign up</a>
    <a href="#" ng-if="isLoggedIn" ng-click="logout()">Log out ({{ user.full_name }})</a>
  </div>

  <main class="detail-main form-page">
    <article class="detail-article reg-wrap event-form-wrap">
      <a class="back-link" href="admin.html"><ico name="arrowLeft" size="16"></ico> Back to manage events</a>

      <p class="eyebrow" data-reveal>Administration</p>
      <h1 class="detail-head__title" data-reveal>{{ isEdit ? 'Edit event' : 'New event' }}</h1>

      <div class="empty" ng-if="loading">Loading...</div>
      <p class="error-block" ng-if="error">{{ error }}</p>

      <form name="eventForm" ng-submit="submit()" novalidate class="reg-form" ng-if="!loading" data-reveal>
        <div class="form-row">
          <div class="form-row__main">
            <div class="field">
              <label for="event_name">Event name *</label>
              <input type="text" id="event_name" name="event_name" ng-model="form.event_name" required>
            </div>

            <div class="field">
              <label for="description">Description</label>
              <textarea id="description" name="description" ng-model="form.description"></textarea>
            </div>
          </div>

          <div class="field form-row__image">
            <label>Event image</label>
            <div class="image-upload">
              <div class="image-upload__preview" ng-if="form.image_url">
                <img ng-src="{{ form.image_url }}" alt="Event image preview" onerror="this.style.display='none'">
              </div>
              <button type="button" class="btn btn--outline btn--sm" ng-click="pickImage()" ng-disabled="uploading">
                <ico name="plus" size="14"></ico> {{ uploading ? 'Uploading...' : 'Upload image' }}
              </button>
              <input type="file" id="event-image" accept="image/*" style="display:none"
                     onchange="angular.element(this).scope().onFileChange(this)">
            </div>
            <input type="text" id="image_url" name="image_url" ng-model="form.image_url" placeholder="Or paste an image URL (images/...)">
          </div>
        </div>

        <div class="field">
          <label for="event_date">Date &amp; time *</label>
          <input type="datetime-local" id="event_date" name="event_date" ng-model="form.event_date" required>
        </div>

        <div class="field">
          <label for="location">Location *</label>
          <input type="text" id="location" name="location" ng-model="form.location" required>
        </div>

        <div class="field">
          <label for="ticket_price">Ticket price ($)</label>
          <input type="number" id="ticket_price" name="ticket_price" step="0.01" min="0" ng-model="form.ticket_price">
        </div>

        <div class="field">
          <label for="goal_amount">Goal amount ($)</label>
          <input type="number" id="goal_amount" name="goal_amount" step="0.01" min="0" ng-model="form.goal_amount">
        </div>

        <div class="field">
          <label for="raised_amount">Raised amount ($)</label>
          <input type="number" id="raised_amount" name="raised_amount" step="0.01" min="0" ng-model="form.raised_amount">
        </div>

        <div class="field">
          <label for="org_id">Organisation *</label>
          <select id="org_id" name="org_id" ng-model="form.org_id"
                  ng-options="o.org_id as o.org_name for o in organisations" required>
            <option value="">Select organisation</option>
          </select>
          <span class="field__chevron"><ico name="chevronDown" size="16"></ico></span>
        </div>

        <div class="field">
          <label for="category_id">Category *</label>
          <select id="category_id" name="category_id" ng-model="form.category_id"
                  ng-options="c.category_id as c.category_name for c in categories" required>
            <option value="">Select category</option>
          </select>
          <span class="field__chevron"><ico name="chevronDown" size="16"></ico></span>
        </div>

        <div class="checkbox-field">
          <input type="checkbox" id="is_suspended" name="is_suspended" ng-model="form.is_suspended">
          <label for="is_suspended">Suspend this event (hide from public listings)</label>
        </div>

        <button type="submit" class="btn btn--solid" ng-disabled="saving">
          {{ saving ? 'Saving...' : (isEdit ? 'Save changes' : 'Create event') }}
        </button>
      </form>
    </article>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <span class="site-footer__brand">PingXiang Charity</span>
      <span class="site-footer__copy">&copy; 2026 PingXiang Charity</span>
      <nav class="site-footer__links">
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
      </nav>
    </div>
  </footer>

  <script src="js/angular.min.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
  <script src="js/controllers.js"></script>
</body>
</html>
